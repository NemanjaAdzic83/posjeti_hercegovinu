spring.profiles.active=local
# ===== OSNOVNA PODE?AVANJA APLIKACIJE =====

# Ime aplikacije. Slu?i samo kao oznaka (u logovima i sl.), ne uti?e na rad.
spring.application.name=backend

# Port na kojem ?e server slu?ati. Aplikacija ?e biti dostupna na http://localhost:8080
# (8080 je podrazumijevana vrijednost, ali je dobro da je vidi? napisanu).
server.port=8080


# ===== VEZA SA MySQL BAZOM =====

# JDBC URL, "adresa" baze. ?ita se dio po dio:
#   jdbc:mysql://        -> koristimo MySQL protokol
#   localhost            -> baza je na ovom istom ra?unaru
#   :3306                -> podrazumijevani MySQL port
#   /posjeti_hercegovinu -> ime baze koju smo napravili u Workbenchu
#   ?serverTimezone=UTC  -> da datumi/vrijeme ne prave probleme sa vremenskim zonama
#   &allowPublicKeyRetrieval=true -> dozvoljava prijavu kod MySQL 8 sa novijim na?inom
#                                    enkripcije lozinke (bez ovoga ?esto dobije? gre?ku)
#   &useSSL=false        -> isklju?uje SSL na lokalnom ra?unaru (nepotrebno lokalno)
spring.datasource.url=jdbc:mysql://localhost:3306/posjeti_hercegovinu?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false

# Korisni?ko ime za MySQL. Naj?e??e "root" (onaj kojim se spaja? u Workbenchu).


# Lozinka koju si postavio pri instalaciji MySQL-a. ZAMIJENI svojom!



# ===== JPA / HIBERNATE (rad sa bazom preko Java klasa) =====

# ?ta Hibernate radi sa tabelama pri pokretanju:
#   update -> sam pravi tabele i dodaje nove kolone prema na?im Java klasama (entity),
#             ali ne bri?e postoje?e podatke. Idealno za razvoj.
# Kasnije (produkcija) ovo mijenjamo u "validate" ili koristimo migracije (Flyway).
spring.jpa.hibernate.ddl-auto=update

# Ispisuje u konzolu SQL upite koje Hibernate ?alje bazi. Odli?no za u?enje:
# vidi? ?ta se zaista de?ava iza kulisa kad pozove? neki endpoint.
spring.jpa.show-sql=true

# Lijepo formatira te SQL upite (u vi?e redova), da se lak?e ?itaju.
spring.jpa.properties.hibernate.format_sql=true